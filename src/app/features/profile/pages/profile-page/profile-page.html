<main class="profile">
  <h1 class="profile__title">Branches</h1>

  <div class="profile__chips" role="group" aria-label="Choose a branch">
    @for (branch of branches(); track branch.id) {
      <button
        type="button"
        class="profile__chip"
        [class.is-active]="branch.id === selectedBranch()?.id"
        [attr.aria-pressed]="branch.id === selectedBranch()?.id"
        (click)="selectBranch(branch)"
      >
        {{ branch.name }}
      </button>
    }
  </div>

  @let selected = selectedBranch();

  @if (selected) {
    <app-branch-weather [branch]="selected" />
  } @else {
    <p class="profile__empty">This business has no branches yet.</p>
  }
</main>
