<div class="inbox">
  <section class="inbox__list">
    <div class="inbox__search">
      <app-search-bar placeholder="Search conversations" [(query)]="searchText" />
    </div>

    <app-inbox-filter-bar [active]="activeFilter()" (activeChange)="selectFilter($event)" />
    @if (inboxService.loading()) {
      <p class="inbox__status">Loading...</p>
    } @else if (inboxService.error()) {
      <div class="inbox__status">
        <p>{{ inboxService.error() }}</p>
        <button type="button" class="inbox__retry" (click)="retry()">Try again</button>
      </div>
    } @else {
      @for (conversation of visibleConversations(); track conversation.id) {
        <app-conversation-tile
          [conversation]="conversation"
          [active]="conversation.id === inboxService.activeId()"
          (selected)="openChat($event)"
        />
      } @empty {
        <p class="inbox__status">No conversations found</p>
      }
    }
  </section>

  <section class="inbox__detail">
    @if (!chatOpen()) {
      <div class="inbox__empty">
        <p>Select a conversation to start chatting</p>
      </div>
    }
    <router-outlet (activate)="chatOpen.set(true)" (deactivate)="chatOpen.set(false)" />
  </section>
</div>
