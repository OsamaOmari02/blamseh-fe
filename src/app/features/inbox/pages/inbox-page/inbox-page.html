<div class="inbox__search">
  <app-search-bar placeholder="Search conversations" [(query)]="searchQuery" />
</div>

<app-inbox-filter-bar [(active)]="activeFilter" />

@if (service.loading()) {
  <p class="inbox__status">Loading...</p>
} @else {
  @for (conversation of visibleConversations(); track conversation.id) {
    <app-conversation-tile [conversation]="conversation" (selected)="openChat($event)" />
  } @empty {
    <p class="inbox__status">No conversations found</p>
  }
}
