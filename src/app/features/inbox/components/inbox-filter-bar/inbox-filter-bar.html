<div class="filter-bar" role="group" aria-label="Filter conversations">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="filter-bar__chip"
      [class.is-active]="active() === option.value"
      [attr.aria-pressed]="active() === option.value"
      (click)="selectFilter(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
